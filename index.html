<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Paper-R-P — Publish</title>
<style>
  :root{
    --bg:#ffffff;
    --bg-2:#f8fafc;
    --bg-3:#f1f5f9;
    --line:#e2e8f0;
    --text:#0f172a;
    --text-2:#475569;
    --muted:#64748b;
    --accent:#0969da;
    --accent-2:#059669;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
  .wrap{max-width:920px;margin:0 auto;padding:64px 24px 96px}
  header{margin-bottom:48px}
  .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
  h1{font-size:40px;line-height:1.15;margin:0 0 12px;letter-spacing:-0.02em}
  .sub{color:var(--text-2);font-size:16px;line-height:1.6;max-width:640px}
  .grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:40px}
  @media (min-width:720px){.grid{grid-template-columns:1fr 1fr}}
  .card{display:block;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:24px;text-decoration:none;color:var(--text);transition:border-color .15s ease, transform .15s ease, background .15s ease}
  .card:hover{border-color:#cbd5e1;background:var(--bg-3);transform:translateY(-1px)}
  .card .tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .card h2{font-size:20px;margin:0 0 8px;letter-spacing:-0.01em}
  .card p{color:var(--text-2);font-size:14px;line-height:1.6;margin:0}
  .card .more{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:var(--accent);font-size:13px;font-weight:600}
  footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  footer a{color:var(--text-2);text-decoration:none}
  footer a:hover{color:var(--accent)}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">26_P1_Project</div>
      <h1>26_P1_Project</h1>
    </header>

    <div class="grid">
      <a class="card" href="./Company-GeneralistAI.html">
        <div class="tag">W18 - Company Brief</div>
        <h2>Generalist AI</h2>
        <p>Generalist AI 회사 개요와 기술/팀/투자 관점 정리.</p>
        <!-- <div class="more">열람하기 →</div> -->
      </a>

      <a class="card" href="./LLM-Wiki-Explainer.html">
        <div class="tag">W18 - Agent Brief</div>
        <h2>LLM_WIKI — LLM이 관리하는 연구 위키</h2>
        <p>LLM이 자율적으로 관리·갱신하는 연구 위키 시스템에 대한 설명.</p>
        <!-- <div class="more">열람하기 →</div> -->
      </a>
    </div>

    <footer>
      <span>Paper-R-P · publish branch</span>
      <a href="https://github.com/chae2chae/Paper-R-P" target="_blank" rel="noreferrer">github.com/chae2chae/Paper-R-P</a>
    </footer>
  </div>
</body>
</html>
